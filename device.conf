# devices/selene/device.conf: Redmi 10 family (selene / selenes / eos) for HakiOS.
# SoC layer is mtk/mt6768/ (MT6769H / Helio G88).
device selene
	title	Redmi 10 / 10 Prime / 10 2022 (selene / selenes / eos)
	vendor	Xiaomi
	soc	mt6769
	defconfig	selene_defconfig
	firmware	pull-firmware.sh
	maintainer	the HakiOS developers
	status display works 1080x2400, scale 2 (fbscale=2 fbfit=3, NT36672C, LK fb 0x7e605000)
	status touch partial Novatek NT36672C on SPI0 0x1100a000, CS0, 9.6 MHz, reset GPIO 92, irq GPIO 1
	status buttons works power and volume, keypad at 0x10010000, MT6358 PMIC (buttons=2)
	status cpu works 8 cores (6x A55, 2x A75 @ 2000 MHz)
	status gpu works Mali-G52 MC2 at 0x13000000 / 0x13040000
	status storage partial eMMC MSDC0 0x11230000, xnusys carved from userdata mmcblk0p53 (emmc_root=1)
	status sensors partial accelerometer through SCP sensor hub
	status wifi partial CONNSYS MT6631 over BTIF/STP (connsys_step=8)
	status bluetooth partial bluetoothd of iOS 16.5 on MT6631, HCI over STP
	status audio missing
	status battery missing MT6358 fuel gauge
	status haptic missing
	status camera partial Samsung S5K JN1 (50 MP) on camsys
	status torch missing
	status cellular missing
	status thermal missing
